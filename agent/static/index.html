<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1c1f;
    --panel: #232428;
    --border: #33353a;
    --text: #e7e7ea;
    --text-dim: #9a9ba3;
    --accent: #d97757;
    --user-bubble: #2d3b4f;
    --ai-bubble: #26272b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header span {
    font-size: 12px;
    color: var(--text-dim);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user, .msg.error {
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg-body p { margin: 0 0 8px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body ul, .msg-body ol { margin: 4px 0 8px 20px; padding: 0; }
  .msg-body li { margin-bottom: 2px; }
  .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
    margin: 10px 0 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .msg-body h1:first-child, .msg-body h2:first-child,
  .msg-body h3:first-child, .msg-body h4:first-child { margin-top: 0; }
  .msg-body code {
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  .msg-body pre {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-body pre code {
    background: none;
    padding: 0;
  }
  .msg.error {
    align-self: flex-start;
    background: #3a2425;
    border: 1px solid #5c2e30;
    color: #f0a8a8;
  }
  .intent-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .thinking {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 14px;
  }
  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #input:focus {
    border-color: var(--accent);
  }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #send:not(:disabled):hover {
    filter: brightness(1.08);
  }
  #attach {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    width: 40px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #attach:hover {
    border-color: var(--accent);
  }
  #attach:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .header-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .header-btn:hover {
    border-color: var(--accent);
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(560px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    padding: 18px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-header h2 {
    font-size: 14px;
    margin: 0;
  }
  .modal-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-search {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .modal-search input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
  }
  .modal-search input:focus { border-color: var(--accent); }
  .modal-search button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #recall-results {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .recall-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .recall-score {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .recall-empty {
    color: var(--text-dim);
    font-size: 13px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .modal-actions button, .form-row button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .modal-actions button:hover, .form-row button:hover {
    border-color: var(--accent);
  }
  .memory-category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 12px 0 6px;
  }
  .memory-category:first-child { margin-top: 0; }
  .memory-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .memory-row .memory-kv {
    flex: 1;
    overflow-wrap: anywhere;
  }
  .memory-row .memory-key {
    color: var(--text-dim);
  }
  .memory-row button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .memory-row button:hover {
    color: var(--text);
  }
  .memory-empty {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .task-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .task-row .task-text {
    flex: 1;
    overflow-wrap: anywhere;
  }
  .task-row.done .task-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }
  .task-row input[type="checkbox"] {
    flex-shrink: 0;
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
  .form-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .form-row select, .form-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
  }
  .form-row select:focus, .form-row input:focus { border-color: var(--accent); }
  .form-row input.key { flex: 1; }
  .form-row input.value { flex: 1.3; }
  .form-row button {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .form-status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    min-height: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ASTI</h1>
    <span>local-first personal assistant</span>
    <button id="tasks-open" class="header-btn">✅ Tasks</button>
    <button id="memory-open" class="header-btn">🧠 Memory</button>
    <button id="recall-open" class="header-btn">🔍 Recall</button>
  </header>
  <div id="messages"></div>
  <div id="composer">
    <button id="attach" title="Attach a file">📎</button>
    <input id="file-input" type="file" hidden>
    <textarea id="input" rows="1" placeholder="Message ASTI..."></textarea>
    <button id="send">Send</button>
  </div>
</div>

<div id="tasks-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Tasks</h2>
      <button id="tasks-close" class="modal-close">&times;</button>
    </div>
    <div id="tasks-list" style="overflow-y: auto;"></div>
    <div class="form-row">
      <input id="tasks-form-text" class="key" type="text" placeholder="Add a task...">
      <button id="tasks-form-add">Add</button>
    </div>
    <div id="tasks-form-status" class="form-status"></div>
  </div>
</div>

<div id="memory-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Personal Memory</h2>
      <button id="memory-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-actions">
      <button id="memory-export">Export</button>
    </div>
    <div id="memory-list" style="overflow-y: auto;"></div>
    <div class="form-row">
      <select id="memory-form-category">
        <option value="identity">identity</option>
        <option value="preferences">preferences</option>
        <option value="goals">goals</option>
        <option value="projects">projects</option>
        <option value="people">people</option>
        <option value="other">other</option>
      </select>
      <input id="memory-form-key" class="key" type="text" placeholder="key">
      <input id="memory-form-value" class="value" type="text" placeholder="value">
      <button id="memory-form-save">Save</button>
    </div>
    <div id="memory-form-status" class="form-status"></div>
  </div>
</div>

<div id="recall-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Semantic Recall</h2>
      <button id="recall-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-search">
      <input id="recall-input" type="text" placeholder="Search past conversations...">
      <button id="recall-search">Search</button>
    </div>
    <div id="recall-results"></div>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const attachEl = document.getElementById("attach");
const fileInputEl = document.getElementById("file-input");

// Minimal, dependency-free markdown renderer. No CDN library on purpose —
// ASTI's core UI shouldn't depend on internet access just to render text.
// Covers what AI responses actually use: headers, bold/italic, inline code,
// fenced code blocks, bullet/numbered lists, paragraphs. Not full CommonMark
// (no tables, nested blockquotes, etc.) — add more as real output needs it.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderInline(s) {
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");
  return s;
}

function renderMarkdown(text) {
  const escaped = escapeHtml(text);

  // Pull fenced code blocks out first so nothing inside them gets touched
  // by inline/list/header processing below.
  const codeBlocks = [];
  const withPlaceholders = escaped.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, "").replace(/\n$/, ""));
    return "\u0000CODEBLOCK" + (codeBlocks.length - 1) + "\u0000";
  });

  const html = [];
  let listType = null; // "ul" | "ol" | null
  let para = [];

  function flushPara() {
    if (para.length) {
      html.push("<p>" + renderInline(para.join(" ")) + "</p>");
      para = [];
    }
  }
  function closeList() {
    if (listType) {
      html.push("</" + listType + ">");
      listType = null;
    }
  }

  for (const rawLine of withPlaceholders.split("\n")) {
    const line = rawLine.trim();

    const codeBlockMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if (codeBlockMatch) {
      flushPara();
      closeList();
      html.push("<pre><code>" + codeBlocks[parseInt(codeBlockMatch[1], 10)] + "</code></pre>");
      continue;
    }

    const headerMatch = line.match(/^(#{1,4})\s+(.*)$/);
    if (headerMatch) {
      flushPara();
      closeList();
      const level = headerMatch[1].length;
      html.push(`<h${level}>` + renderInline(headerMatch[2]) + `</h${level}>`);
      continue;
    }

    const bulletMatch = line.match(/^[-*]\s+(.*)$/);
    const numberedMatch = line.match(/^\d+\.\s+(.*)$/);

    if (bulletMatch) {
      flushPara();
      if (listType !== "ul") { closeList(); html.push("<ul>"); listType = "ul"; }
      html.push("<li>" + renderInline(bulletMatch[1]) + "</li>");
      continue;
    }
    if (numberedMatch) {
      flushPara();
      if (listType !== "ol") { closeList(); html.push("<ol>"); listType = "ol"; }
      html.push("<li>" + renderInline(numberedMatch[1]) + "</li>");
      continue;
    }

    if (line === "") {
      flushPara();
      closeList();
      continue;
    }

    para.push(line);
  }
  flushPara();
  closeList();

  return html.join("\n");
}

function addMessage(role, text, intent) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (intent) {
    const tag = document.createElement("div");
    tag.className = "intent-tag";
    tag.textContent = intent;
    div.appendChild(tag);
    const body = document.createElement("div");
    body.className = "msg-body";
    body.innerHTML = renderMarkdown(text);
    div.appendChild(body);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.textContent = "ASTI is thinking…";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage("user", text);
  inputEl.value = "";
  autosize();
  sendEl.disabled = true;
  const thinking = addThinking();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });

    thinking.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("error", "Error: " + (err.error || res.statusText));
      return;
    }

    const data = await res.json();
    addMessage("ai", data.response, data.intent);
  } catch (e) {
    thinking.remove();
    addMessage("error", "Could not reach ASTI — is the server running?");
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendEl.addEventListener("click", sendMessage);

// --- File upload (GUI entry point for file tools — no persistence yet,
// each upload is a one-shot summary, same as the CLI's /read) ---
attachEl.addEventListener("click", () => fileInputEl.click());

fileInputEl.addEventListener("change", async () => {
  const file = fileInputEl.files[0];
  fileInputEl.value = ""; // allow re-selecting the same file later
  if (!file) return;

  addMessage("user", "📎 " + file.name);
  attachEl.disabled = true;
  sendEl.disabled = true;
  const thinking = addThinking();

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/api/read", { method: "POST", body: formData });
    thinking.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("error", "Error: " + (err.error || res.statusText));
      return;
    }

    const data = await res.json();
    addMessage("ai", data.summary, "file");
  } catch (e) {
    thinking.remove();
    addMessage("error", "Could not reach ASTI — is the server running?");
  } finally {
    attachEl.disabled = false;
    sendEl.disabled = false;
  }
});

inputEl.focus();

// --- Semantic recall modal ---
const recallBackdrop = document.getElementById("recall-backdrop");
const recallOpen = document.getElementById("recall-open");
const recallClose = document.getElementById("recall-close");
const recallInput = document.getElementById("recall-input");
const recallSearchBtn = document.getElementById("recall-search");
const recallResults = document.getElementById("recall-results");

function openRecall() {
  recallBackdrop.hidden = false;
  recallInput.focus();
}

function closeRecall() {
  recallBackdrop.hidden = true;
}

async function runRecallSearch() {
  const query = recallInput.value.trim();
  if (!query) return;

  recallResults.innerHTML = '<div class="recall-empty">Searching…</div>';

  try {
    const res = await fetch("/api/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      recallResults.innerHTML = '<div class="recall-empty">Error: ' +
        (err.error || res.statusText) + "</div>";
      return;
    }

    const data = await res.json();
    recallResults.innerHTML = "";

    if (!data.results.length) {
      recallResults.innerHTML =
        '<div class="recall-empty">No matches — only turns saved since ' +
        "semantic recall was added are searchable this way.</div>";
      return;
    }

    for (const r of data.results) {
      const div = document.createElement("div");
      div.className = "recall-item";
      const score = document.createElement("div");
      score.className = "recall-score";
      score.textContent = "score " + r.score.toFixed(3);
      const user = document.createElement("div");
      user.textContent = "You: " + r.user;
      const ai = document.createElement("div");
      ai.style.color = "var(--text-dim)";
      ai.style.marginTop = "4px";
      ai.textContent = "ASTI: " + r.ai;
      div.appendChild(score);
      div.appendChild(user);
      div.appendChild(ai);
      recallResults.appendChild(div);
    }
  } catch (e) {
    recallResults.innerHTML =
      '<div class="recall-empty">Could not reach ASTI.</div>';
  }
}

recallOpen.addEventListener("click", openRecall);
recallClose.addEventListener("click", closeRecall);
recallBackdrop.addEventListener("click", (e) => {
  if (e.target === recallBackdrop) closeRecall();
});
recallSearchBtn.addEventListener("click", runRecallSearch);
recallInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    runRecallSearch();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !recallBackdrop.hidden) closeRecall();
});

// --- Memory vault modal ---
const memoryBackdrop = document.getElementById("memory-backdrop");
const memoryOpen = document.getElementById("memory-open");
const memoryClose = document.getElementById("memory-close");
const memoryList = document.getElementById("memory-list");
const memoryExportBtn = document.getElementById("memory-export");
const memoryFormCategory = document.getElementById("memory-form-category");
const memoryFormKey = document.getElementById("memory-form-key");
const memoryFormValue = document.getElementById("memory-form-value");
const memoryFormSave = document.getElementById("memory-form-save");
const memoryFormStatus = document.getElementById("memory-form-status");

async function forgetMemoryEntry(category, key) {
  try {
    const res = await fetch("/api/memory/forget", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category, key }),
    });
    if (res.ok) loadMemoryList();
  } catch (e) {
    // ignore — list just won't refresh
  }
}

async function loadMemoryList() {
  memoryList.innerHTML = '<div class="memory-empty">Loading…</div>';

  try {
    const res = await fetch("/api/memory");
    if (!res.ok) {
      memoryList.innerHTML = '<div class="memory-empty">Could not load memory.</div>';
      return;
    }

    const data = await res.json();
    memoryList.innerHTML = "";
    let anyEntries = false;

    for (const category of Object.keys(data).sort()) {
      const entries = data[category];
      const keys = Object.keys(entries).sort();
      if (!keys.length) continue;
      anyEntries = true;

      const heading = document.createElement("div");
      heading.className = "memory-category";
      heading.textContent = category;
      memoryList.appendChild(heading);

      for (const key of keys) {
        const value = entries[key];
        const row = document.createElement("div");
        row.className = "memory-row";

        const kv = document.createElement("div");
        kv.className = "memory-kv";
        kv.innerHTML = '<span class="memory-key">' + escapeHtml(key) +
          ':</span> ' + escapeHtml(String(value));
        row.appendChild(kv);

        const editBtn = document.createElement("button");
        editBtn.textContent = "✎";
        editBtn.title = "Edit";
        editBtn.addEventListener("click", () => {
          memoryFormCategory.value = category;
          memoryFormKey.value = key;
          memoryFormValue.value = value;
          memoryFormValue.focus();
        });
        row.appendChild(editBtn);

        const delBtn = document.createElement("button");
        delBtn.textContent = "×";
        delBtn.title = "Delete";
        delBtn.addEventListener("click", () => forgetMemoryEntry(category, key));
        row.appendChild(delBtn);

        memoryList.appendChild(row);
      }
    }

    if (!anyEntries) {
      memoryList.innerHTML = '<div class="memory-empty">Nothing stored yet.</div>';
    }
  } catch (e) {
    memoryList.innerHTML = '<div class="memory-empty">Could not reach ASTI.</div>';
  }
}

function openMemory() {
  memoryBackdrop.hidden = false;
  memoryFormStatus.textContent = "";
  loadMemoryList();
}
function closeMemory() {
  memoryBackdrop.hidden = true;
}

memoryOpen.addEventListener("click", openMemory);
memoryClose.addEventListener("click", closeMemory);
memoryBackdrop.addEventListener("click", (e) => {
  if (e.target === memoryBackdrop) closeMemory();
});

memoryFormSave.addEventListener("click", async () => {
  const category = memoryFormCategory.value;
  const key = memoryFormKey.value.trim();
  const value = memoryFormValue.value.trim();

  if (!key || !value) {
    memoryFormStatus.textContent = "Key and value are both required.";
    return;
  }

  memoryFormStatus.textContent = "Saving…";
  try {
    const res = await fetch("/api/memory/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category, key, value }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      memoryFormStatus.textContent = "Error: " + (err.error || res.statusText);
      return;
    }
    memoryFormKey.value = "";
    memoryFormValue.value = "";
    memoryFormStatus.textContent = "Saved.";
    loadMemoryList();
  } catch (e) {
    memoryFormStatus.textContent = "Could not reach ASTI.";
  }
});

memoryExportBtn.addEventListener("click", async () => {
  memoryFormStatus.textContent = "Exporting…";
  try {
    const res = await fetch("/api/memory/export", { method: "POST" });
    const data = await res.json();
    memoryFormStatus.textContent = res.ok
      ? "Exported to " + data.filename
      : "Error: " + (data.error || res.statusText);
  } catch (e) {
    memoryFormStatus.textContent = "Could not reach ASTI.";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !memoryBackdrop.hidden) closeMemory();
});

// --- Tasks modal ---
const tasksBackdrop = document.getElementById("tasks-backdrop");
const tasksOpen = document.getElementById("tasks-open");
const tasksClose = document.getElementById("tasks-close");
const tasksList = document.getElementById("tasks-list");
const tasksFormText = document.getElementById("tasks-form-text");
const tasksFormAdd = document.getElementById("tasks-form-add");
const tasksFormStatus = document.getElementById("tasks-form-status");

async function completeTaskEntry(id) {
  try {
    const res = await fetch("/api/tasks/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }),
    });
    if (res.ok) loadTasksList();
  } catch (e) {
    // ignore — list just won't refresh
  }
}

async function loadTasksList() {
  tasksList.innerHTML = '<div class="memory-empty">Loading…</div>';

  try {
    const res = await fetch("/api/tasks");
    if (!res.ok) {
      tasksList.innerHTML = '<div class="memory-empty">Could not load tasks.</div>';
      return;
    }

    const tasks = await res.json();
    tasksList.innerHTML = "";

    if (!tasks.length) {
      tasksList.innerHTML = '<div class="memory-empty">No tasks yet.</div>';
      return;
    }

    for (const task of tasks) {
      const row = document.createElement("div");
      row.className = "task-row" + (task.done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.disabled = task.done;
      checkbox.addEventListener("change", () => completeTaskEntry(task.id));
      row.appendChild(checkbox);

      const text = document.createElement("div");
      text.className = "task-text";
      text.textContent = task.text;
      row.appendChild(text);

      tasksList.appendChild(row);
    }
  } catch (e) {
    tasksList.innerHTML = '<div class="memory-empty">Could not reach ASTI.</div>';
  }
}

function openTasks() {
  tasksBackdrop.hidden = false;
  tasksFormStatus.textContent = "";
  loadTasksList();
}
function closeTasks() {
  tasksBackdrop.hidden = true;
}

tasksOpen.addEventListener("click", openTasks);
tasksClose.addEventListener("click", closeTasks);
tasksBackdrop.addEventListener("click", (e) => {
  if (e.target === tasksBackdrop) closeTasks();
});

async function addTaskEntry() {
  const text = tasksFormText.value.trim();
  if (!text) return;

  tasksFormStatus.textContent = "Adding…";
  try {
    const res = await fetch("/api/tasks/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      tasksFormStatus.textContent = "Error: " + (err.error || res.statusText);
      return;
    }
    tasksFormText.value = "";
    tasksFormStatus.textContent = "";
    loadTasksList();
  } catch (e) {
    tasksFormStatus.textContent = "Could not reach ASTI.";
  }
}

tasksFormAdd.addEventListener("click", addTaskEntry);
tasksFormText.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    addTaskEntry();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !tasksBackdrop.hidden) closeTasks();
});
</script>
