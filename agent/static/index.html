<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #18140f;
    --panel: rgba(37, 30, 26, 0.72);
    --sidebar-bg: rgba(22, 18, 15, 0.78);
    --border: rgba(255, 190, 160, 0.10);
    --text: #f3ece6;
    --text-dim: #a69a90;
    --accent: #e8805c;
    --accent-hover: #f0906e;
    --accent-dim: rgba(232, 128, 92, 0.18);
    --accent-gradient: linear-gradient(135deg, #f0a06a 0%, #e8805c 45%, #d9643f 100%);
    --user-bubble: linear-gradient(135deg, #32455c 0%, #28374a 100%);
    --ai-bubble: rgba(255, 255, 255, 0.03);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    --glow: 0 4px 18px rgba(232, 128, 92, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(circle at 15% -10%, rgba(232, 128, 92, 0.16), transparent 55%),
      radial-gradient(circle at 85% 110%, rgba(240, 168, 92, 0.08), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #3a3a3a;
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  #app {
    display: flex;
    flex-direction: row;
    height: 100vh;
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.18s ease, opacity 0.18s ease;
  }
  #app.sidebar-collapsed #sidebar {
    width: 0;
    opacity: 0;
    border-right: none;
  }
  #sidebar-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 12px;
    flex-shrink: 0;
  }
  #new-chat-btn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    border: 1px solid rgba(232, 128, 92, 0.3);
    color: var(--text);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  #new-chat-btn:hover {
    background: rgba(232, 128, 92, 0.26);
    border-color: var(--accent);
    box-shadow: 0 2px 14px rgba(232, 128, 92, 0.2);
  }
  #new-chat-btn:active { transform: scale(0.98); }
  #sidebar-collapse {
    background: transparent;
    border: none;
    color: var(--text-dim);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  #sidebar-collapse:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }
  #conversation-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .conversation-item {
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .conversation-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }
  .conversation-item.active {
    background: linear-gradient(135deg, rgba(240, 160, 106, 0.22), rgba(217, 100, 63, 0.10));
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(232, 128, 92, 0.25);
  }
  .conversation-empty {
    color: var(--text-dim);
    font-size: 12px;
    padding: 10px;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  #sidebar-toggle {
    background: transparent;
    border: none;
    color: var(--text-dim);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  #sidebar-toggle:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    position: relative;
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    word-wrap: break-word;
  }
  .msg.user, .msg.error {
    white-space: pre-wrap;
  }
  .reply-btn {
    position: absolute;
    top: 2px;
    right: -26px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .msg:hover .reply-btn {
    opacity: 1;
  }
  .reply-btn:hover {
    color: var(--accent);
  }
  .msg.user .reply-btn {
    right: auto;
    left: -26px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
  }
  .msg-body p { margin: 0 0 8px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body ul, .msg-body ol { margin: 4px 0 8px 20px; padding: 0; }
  .msg-body li { margin-bottom: 2px; }
  .msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
    margin: 10px 0 6px;
    font-size: 14px;
    font-weight: 600;
  }
  .msg-body h1:first-child, .msg-body h2:first-child,
  .msg-body h3:first-child, .msg-body h4:first-child { margin-top: 0; }
  .msg-body code {
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  .msg-body pre {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-body pre code {
    background: none;
    padding: 0;
  }
  .msg.error {
    align-self: flex-start;
    background: #3a2425;
    border: 1px solid #5c2e30;
    color: #f0a8a8;
  }
  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .intent-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .source-badge {
    font-size: 11px;
    color: var(--text-dim);
    padding-left: 8px;
    border-left: 1px solid var(--border);
    cursor: default;
  }
  .memory-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .memory-chip-text {
    flex: 1;
  }
  .memory-chip-btn {
    border: none;
    border-radius: 7px;
    padding: 4px 11px;
    font-size: 11px;
    cursor: pointer;
    transition: background-color 0.15s ease, filter 0.15s ease;
  }
  .memory-chip-save {
    background: var(--accent-gradient);
    color: #fff;
  }
  .memory-chip-save:hover:not(:disabled) {
    filter: brightness(1.1);
    box-shadow: 0 2px 10px rgba(232, 128, 92, 0.3);
  }
  .memory-chip-discard {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .memory-chip-discard:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.06);
  }
  .memory-chip-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .thinking {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 14px;
  }
  #reference-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  #reference-chip-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-left: 2px solid var(--accent);
    padding-left: 8px;
  }
  #reference-clear {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #reference-clear:hover {
    color: var(--text);
  }
  #composer {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.3);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #input:focus {
    border-color: var(--accent);
  }
  #send {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(232, 128, 92, 0.25);
    transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  #send:disabled {
    opacity: 0.45;
    cursor: default;
    box-shadow: none;
  }
  #send:not(:disabled):hover {
    filter: brightness(1.1);
    box-shadow: var(--glow);
  }
  #send:not(:disabled):active {
    transform: scale(0.97);
  }
  #attach {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    width: 42px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  #attach:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: #3d3d3d;
  }
  #attach:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .header-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .header-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: #3d3d3d;
  }
  .switch-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .switch-label {
    font-size: 12px;
    color: var(--text-dim);
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .switch.on {
    background: var(--accent-gradient);
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(232, 128, 92, 0.3);
  }
  .switch:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s ease;
  }
  .switch.on .switch-thumb {
    transform: translateX(18px);
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--panel);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    width: min(560px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-header h2 {
    font-size: 14px;
    margin: 0;
  }
  .modal-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    border-radius: 6px;
    padding: 2px 6px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .modal-close:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }
  .modal-search {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .modal-search input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .modal-search input:focus { border-color: var(--accent); }
  .modal-search button {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    cursor: pointer;
    transition: filter 0.15s ease, box-shadow 0.15s ease;
  }
  .modal-search button:hover {
    filter: brightness(1.1);
    box-shadow: 0 2px 10px rgba(232, 128, 92, 0.3);
  }
  #recall-results {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .recall-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .recall-score {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .recall-empty {
    color: var(--text-dim);
    font-size: 13px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .modal-actions button, .form-row button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .modal-actions button:hover, .form-row button:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: #3d3d3d;
  }
  .memory-category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 12px 0 6px;
  }
  .memory-category:first-child { margin-top: 0; }
  .memory-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .memory-row .memory-kv {
    flex: 1;
    overflow-wrap: anywhere;
  }
  .memory-row .memory-key {
    color: var(--text-dim);
  }
  .memory-row button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    flex-shrink: 0;
    border-radius: 5px;
    transition: color 0.15s ease, background-color 0.15s ease;
  }
  .memory-row button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
  }
  .memory-empty {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .status-report {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
    margin: 0;
  }
  .form-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .form-row select, .form-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .form-row select:focus, .form-row input:focus { border-color: var(--accent); }
  .form-row input.key { flex: 1; }
  .form-row input.value { flex: 1.3; }
  .form-row button {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
  }
  .form-row button:hover {
    filter: brightness(1.1);
    box-shadow: 0 2px 10px rgba(232, 128, 92, 0.3);
  }
  .form-status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    min-height: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <button id="new-chat-btn">+ New chat</button>
      <button id="sidebar-collapse" title="Hide sidebar">◀</button>
    </div>
    <div id="conversation-list"></div>
  </nav>
  <div id="main">
    <header>
      <button id="sidebar-toggle" title="Show sidebar" hidden>☰</button>
      <h1>ASTI</h1>
      <div class="switch-group">
        <span id="cloud-switch-label" class="switch-label">Cloud</span>
        <button id="cloud-toggle" class="switch" role="switch" aria-checked="false"
          title="Toggle whether general-knowledge questions can reach the cloud">
          <span class="switch-thumb"></span>
        </button>
      </div>
      <button id="status-open" class="header-btn">📊 Status</button>
      <button id="memory-open" class="header-btn">🧠 Memory</button>
      <button id="recall-open" class="header-btn">🔍 Recall</button>
    </header>
    <div id="messages"></div>
    <div id="reference-chip" hidden>
      <span id="reference-chip-text"></span>
      <button id="reference-clear" title="Clear reference">&times;</button>
    </div>
    <div id="composer">
      <button id="attach" title="Attach a file">📎</button>
      <input id="file-input" type="file" hidden>
      <textarea id="input" rows="1" placeholder="Message ASTI..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<div id="status-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Diagnostics</h2>
      <button id="status-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-actions">
      <button id="status-refresh">Refresh</button>
    </div>
    <pre id="status-report" class="status-report">Loading…</pre>
  </div>
</div>

<div id="memory-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Personal Memory</h2>
      <button id="memory-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-actions">
      <button id="memory-export">Export</button>
    </div>
    <div id="memory-list" style="overflow-y: auto;"></div>
    <div class="form-row">
      <select id="memory-form-category">
        <option value="identity">identity</option>
        <option value="preferences">preferences</option>
        <option value="goals">goals</option>
        <option value="projects">projects</option>
        <option value="people">people</option>
        <option value="other">other</option>
      </select>
      <input id="memory-form-key" class="key" type="text" placeholder="key">
      <input id="memory-form-value" class="value" type="text" placeholder="value">
      <button id="memory-form-save">Save</button>
    </div>
    <div id="memory-form-status" class="form-status"></div>
  </div>
</div>

<div id="recall-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Semantic Recall</h2>
      <button id="recall-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-search">
      <input id="recall-input" type="text" placeholder="Search past conversations...">
      <button id="recall-search">Search</button>
    </div>
    <div id="recall-results"></div>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const attachEl = document.getElementById("attach");
const fileInputEl = document.getElementById("file-input");

// Minimal, dependency-free markdown renderer. No CDN library on purpose —
// ASTI's core UI shouldn't depend on internet access just to render text.
// Covers what AI responses actually use: headers, bold/italic, inline code,
// fenced code blocks, bullet/numbered lists, paragraphs. Not full CommonMark
// (no tables, nested blockquotes, etc.) — add more as real output needs it.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderInline(s) {
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");
  return s;
}

function renderMarkdown(text) {
  const escaped = escapeHtml(text);

  // Pull fenced code blocks out first so nothing inside them gets touched
  // by inline/list/header processing below.
  const codeBlocks = [];
  const withPlaceholders = escaped.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, "").replace(/\n$/, ""));
    return "\u0000CODEBLOCK" + (codeBlocks.length - 1) + "\u0000";
  });

  const html = [];
  let listType = null; // "ul" | "ol" | null
  let para = [];

  function flushPara() {
    if (para.length) {
      html.push("<p>" + renderInline(para.join(" ")) + "</p>");
      para = [];
    }
  }
  function closeList() {
    if (listType) {
      html.push("</" + listType + ">");
      listType = null;
    }
  }

  for (const rawLine of withPlaceholders.split("\n")) {
    const line = rawLine.trim();

    const codeBlockMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000$/);
    if (codeBlockMatch) {
      flushPara();
      closeList();
      html.push("<pre><code>" + codeBlocks[parseInt(codeBlockMatch[1], 10)] + "</code></pre>");
      continue;
    }

    const headerMatch = line.match(/^(#{1,4})\s+(.*)$/);
    if (headerMatch) {
      flushPara();
      closeList();
      const level = headerMatch[1].length;
      html.push(`<h${level}>` + renderInline(headerMatch[2]) + `</h${level}>`);
      continue;
    }

    const bulletMatch = line.match(/^[-*]\s+(.*)$/);
    const numberedMatch = line.match(/^\d+\.\s+(.*)$/);

    if (bulletMatch) {
      flushPara();
      if (listType !== "ul") { closeList(); html.push("<ul>"); listType = "ul"; }
      html.push("<li>" + renderInline(bulletMatch[1]) + "</li>");
      continue;
    }
    if (numberedMatch) {
      flushPara();
      if (listType !== "ol") { closeList(); html.push("<ol>"); listType = "ol"; }
      html.push("<li>" + renderInline(numberedMatch[1]) + "</li>");
      continue;
    }

    if (line === "") {
      flushPara();
      closeList();
      continue;
    }

    para.push(line);
  }
  flushPara();
  closeList();

  return html.join("\n");
}

function buildSourceBadge(source) {
  const badge = document.createElement("span");
  badge.className = "source-badge";
  if (source === "cloud") {
    badge.textContent = "☁️ Cloud";
    badge.title = "Answered by the cloud provider (general-knowledge questions only).";
  } else {
    badge.textContent = "🖥️ Local";
    // The old inline disclaimer this replaced said this in prose on every
    // local-fallback answer; now it's a hover tooltip instead, so the
    // message body itself stays short (10/13, Carter's call).
    badge.title = "Answered by the local model — it can confidently state " +
      "incorrect specifics on topics like events, incidents, or dates. " +
      "Verify anything specific independently.";
  }
  return badge;
}

function addMessage(role, text, intent, pendingMemory, source) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "ai") {
    // Markdown rendering applies to every AI message, not just ones with
    // a known intent — loaded history has no stored intent (never
    // persisted per-turn) but should still render the same way.
    if (intent || source) {
      const meta = document.createElement("div");
      meta.className = "msg-meta";
      if (intent) {
        const tag = document.createElement("span");
        tag.className = "intent-tag";
        tag.textContent = intent;
        meta.appendChild(tag);
      }
      if (source) {
        meta.appendChild(buildSourceBadge(source));
      }
      div.appendChild(meta);
    }
    const body = document.createElement("div");
    body.className = "msg-body";
    body.innerHTML = renderMarkdown(text);
    div.appendChild(body);

    // Extraction-noise fix (10/13): personal_memory is never written
    // silently anymore. When this turn extracted a candidate fact,
    // /api/chat returns it unsaved as pendingMemory — show it here and
    // only call /api/memory/confirm if the user actually clicks Save.
    if (pendingMemory) {
      div.appendChild(buildMemoryChip(pendingMemory));
    }
  } else {
    div.textContent = text;
  }

  // Reply affordance — lets the user explicitly point at this exact
  // message instead of relying on the model to guess what "it"/"that"
  // means from fuzzy recent-turns context. User and AI messages only;
  // not error/thinking bubbles.
  if (role === "user" || role === "ai") {
    const replyBtn = document.createElement("button");
    replyBtn.className = "reply-btn";
    replyBtn.title = "Reference this message";
    replyBtn.textContent = "↩";
    replyBtn.addEventListener("click", () => setReference(text));
    div.appendChild(replyBtn);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function buildMemoryChip(pendingMemory) {
  const chip = document.createElement("div");
  chip.className = "memory-chip";

  const text = document.createElement("span");
  text.className = "memory-chip-text";
  text.textContent =
    `Remember ${pendingMemory.category} → ${pendingMemory.key} = ${pendingMemory.value}?`;
  chip.appendChild(text);

  const saveBtn = document.createElement("button");
  saveBtn.className = "memory-chip-btn memory-chip-save";
  saveBtn.textContent = "Save";

  const discardBtn = document.createElement("button");
  discardBtn.className = "memory-chip-btn memory-chip-discard";
  discardBtn.textContent = "Discard";

  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true;
    discardBtn.disabled = true;
    try {
      const res = await fetch("/api/memory/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pendingMemory),
      });
      text.textContent = res.ok
        ? `Saved: ${pendingMemory.category}.${pendingMemory.key} = ${pendingMemory.value}`
        : "Could not save — try the Memory panel instead.";
    } catch (e) {
      text.textContent = "Could not save — try the Memory panel instead.";
    }
    saveBtn.remove();
    discardBtn.remove();
  });

  discardBtn.addEventListener("click", () => {
    text.textContent = "Discarded.";
    saveBtn.remove();
    discardBtn.remove();
  });

  chip.appendChild(saveBtn);
  chip.appendChild(discardBtn);
  return chip;
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.textContent = "ASTI is thinking…";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// --- Reference a prior message — lets the user explicitly point at an
// earlier message instead of relying on the model to guess what "it"/
// "that" means. One-shot: clears itself after the next message is sent,
// same as "reply to" in most chat apps.
const referenceChip = document.getElementById("reference-chip");
const referenceChipText = document.getElementById("reference-chip-text");
const referenceClear = document.getElementById("reference-clear");
let activeReference = null;

function setReference(text) {
  activeReference = text;
  referenceChipText.textContent = text.replace(/\s+/g, " ").slice(0, 140);
  referenceChip.hidden = false;
  inputEl.focus();
}

function clearReference() {
  activeReference = null;
  referenceChip.hidden = true;
}

referenceClear.addEventListener("click", clearReference);

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  const reference = activeReference;
  clearReference();

  addMessage("user", text);
  inputEl.value = "";
  autosize();
  sendEl.disabled = true;
  const thinking = addThinking();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, reference, conversation_id: activeConversationId }),
    });

    thinking.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("error", "Error: " + (err.error || res.statusText));
      return;
    }

    const data = await res.json();
    addMessage("ai", data.response, data.intent, data.pending_memory, data.source);
    // Refreshes the sidebar so a brand-new chat's auto-generated title
    // (and its move to the top of the list) shows up right away.
    loadConversationList();
  } catch (e) {
    thinking.remove();
    addMessage("error", "Could not reach ASTI — is the server running?");
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendEl.addEventListener("click", sendMessage);

// --- File upload (GUI entry point for file tools — no persistence yet,
// each upload is a one-shot summary, same as the CLI's /read) ---
attachEl.addEventListener("click", () => fileInputEl.click());

fileInputEl.addEventListener("change", async () => {
  const file = fileInputEl.files[0];
  fileInputEl.value = ""; // allow re-selecting the same file later
  if (!file) return;

  addMessage("user", "📎 " + file.name);
  attachEl.disabled = true;
  sendEl.disabled = true;
  const thinking = addThinking();

  const formData = new FormData();
  formData.append("file", file);
  formData.append("conversation_id", activeConversationId);

  try {
    const res = await fetch("/api/read", { method: "POST", body: formData });
    thinking.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("error", "Error: " + (err.error || res.statusText));
      return;
    }

    const data = await res.json();
    addMessage("ai", data.summary, "file", null, "local");
    loadConversationList();
  } catch (e) {
    thinking.remove();
    addMessage("error", "Could not reach ASTI — is the server running?");
  } finally {
    attachEl.disabled = false;
    sendEl.disabled = false;
  }
});

// --- Conversations sidebar (10/14, ChatGPT-style rework): opening the
// app always starts a brand-new chat instead of continuing one endless
// history; past chats live in a hideable sidebar and can be reopened.
// Nothing about search/recall changes — every turn in every chat is
// still saved and searchable, this is just how the main view organizes
// what's shown by default.
let activeConversationId = null;

const sidebarEl = document.getElementById("sidebar");
const appEl = document.getElementById("app");
const conversationListEl = document.getElementById("conversation-list");
const newChatBtn = document.getElementById("new-chat-btn");
const sidebarCollapseBtn = document.getElementById("sidebar-collapse");
const sidebarToggleBtn = document.getElementById("sidebar-toggle");

async function loadConversationList() {
  try {
    const res = await fetch("/api/conversations");
    if (!res.ok) return;
    const data = await res.json();
    renderConversationList(data.conversations);
  } catch (e) {
    // Sidebar just stays as-is — not fatal to using the chat itself.
  }
}

function renderConversationList(conversations) {
  conversationListEl.innerHTML = "";

  if (!conversations.length) {
    const empty = document.createElement("div");
    empty.className = "conversation-empty";
    empty.textContent = "No past chats yet.";
    conversationListEl.appendChild(empty);
    return;
  }

  for (const conv of conversations) {
    const item = document.createElement("div");
    item.className = "conversation-item" + (conv.id === activeConversationId ? " active" : "");
    item.textContent = conv.title;
    item.title = conv.title;
    item.addEventListener("click", () => openConversation(conv.id));
    conversationListEl.appendChild(item);
  }
}

async function openConversation(id) {
  try {
    const res = await fetch(`/api/conversations/${id}`);
    if (!res.ok) return;
    const data = await res.json();

    activeConversationId = id;
    messagesEl.innerHTML = "";
    clearReference();

    for (const turn of data.turns) {
      addMessage("user", turn.user);
      addMessage("ai", turn.ai, null, null, turn.source);
    }

    loadConversationList();
    inputEl.focus();
  } catch (e) {
    addMessage("error", "Could not load that conversation.");
  }
}

async function startNewConversation() {
  try {
    const res = await fetch("/api/conversations", { method: "POST" });
    const data = await res.json();
    activeConversationId = data.id;
    messagesEl.innerHTML = "";
    clearReference();
    loadConversationList();
    inputEl.focus();
  } catch (e) {
    addMessage("error", "Could not reach ASTI — is the server running?");
  }
}

newChatBtn.addEventListener("click", startNewConversation);

function setSidebarCollapsed(collapsed) {
  appEl.classList.toggle("sidebar-collapsed", collapsed);
  sidebarToggleBtn.hidden = !collapsed;
}

sidebarCollapseBtn.addEventListener("click", () => setSidebarCollapsed(true));
sidebarToggleBtn.addEventListener("click", () => setSidebarCollapsed(false));

startNewConversation();

// --- Semantic recall modal ---
const recallBackdrop = document.getElementById("recall-backdrop");
const recallOpen = document.getElementById("recall-open");
const recallClose = document.getElementById("recall-close");
const recallInput = document.getElementById("recall-input");
const recallSearchBtn = document.getElementById("recall-search");
const recallResults = document.getElementById("recall-results");

function openRecall() {
  recallBackdrop.hidden = false;
  recallInput.focus();
}

function closeRecall() {
  recallBackdrop.hidden = true;
}

async function runRecallSearch() {
  const query = recallInput.value.trim();
  if (!query) return;

  recallResults.innerHTML = '<div class="recall-empty">Searching…</div>';

  try {
    const res = await fetch("/api/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      recallResults.innerHTML = '<div class="recall-empty">Error: ' +
        (err.error || res.statusText) + "</div>";
      return;
    }

    const data = await res.json();
    recallResults.innerHTML = "";

    if (!data.results.length) {
      recallResults.innerHTML =
        '<div class="recall-empty">No matches — only turns saved since ' +
        "semantic recall was added are searchable this way.</div>";
      return;
    }

    for (const r of data.results) {
      const div = document.createElement("div");
      div.className = "recall-item";
      const score = document.createElement("div");
      score.className = "recall-score";
      score.textContent = "score " + r.score.toFixed(3);
      const user = document.createElement("div");
      user.textContent = "You: " + r.user;
      const ai = document.createElement("div");
      ai.style.color = "var(--text-dim)";
      ai.style.marginTop = "4px";
      ai.textContent = "ASTI: " + r.ai;
      div.appendChild(score);
      div.appendChild(user);
      div.appendChild(ai);
      recallResults.appendChild(div);
    }
  } catch (e) {
    recallResults.innerHTML =
      '<div class="recall-empty">Could not reach ASTI.</div>';
  }
}

recallOpen.addEventListener("click", openRecall);
recallClose.addEventListener("click", closeRecall);
recallBackdrop.addEventListener("click", (e) => {
  if (e.target === recallBackdrop) closeRecall();
});
recallSearchBtn.addEventListener("click", runRecallSearch);
recallInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    runRecallSearch();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !recallBackdrop.hidden) closeRecall();
});

// --- Memory vault modal ---
const memoryBackdrop = document.getElementById("memory-backdrop");
const memoryOpen = document.getElementById("memory-open");
const memoryClose = document.getElementById("memory-close");
const memoryList = document.getElementById("memory-list");
const memoryExportBtn = document.getElementById("memory-export");
const memoryFormCategory = document.getElementById("memory-form-category");
const memoryFormKey = document.getElementById("memory-form-key");
const memoryFormValue = document.getElementById("memory-form-value");
const memoryFormSave = document.getElementById("memory-form-save");
const memoryFormStatus = document.getElementById("memory-form-status");

async function forgetMemoryEntry(category, key) {
  try {
    const res = await fetch("/api/memory/forget", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category, key }),
    });
    if (res.ok) loadMemoryList();
  } catch (e) {
    // ignore — list just won't refresh
  }
}

async function loadMemoryList() {
  memoryList.innerHTML = '<div class="memory-empty">Loading…</div>';

  try {
    const res = await fetch("/api/memory");
    if (!res.ok) {
      memoryList.innerHTML = '<div class="memory-empty">Could not load memory.</div>';
      return;
    }

    const data = await res.json();
    memoryList.innerHTML = "";
    let anyEntries = false;

    for (const category of Object.keys(data).sort()) {
      const entries = data[category];
      const keys = Object.keys(entries).sort();
      if (!keys.length) continue;
      anyEntries = true;

      const heading = document.createElement("div");
      heading.className = "memory-category";
      heading.textContent = category;
      memoryList.appendChild(heading);

      for (const key of keys) {
        const value = entries[key];
        const row = document.createElement("div");
        row.className = "memory-row";

        const kv = document.createElement("div");
        kv.className = "memory-kv";
        kv.innerHTML = '<span class="memory-key">' + escapeHtml(key) +
          ':</span> ' + escapeHtml(String(value));
        row.appendChild(kv);

        const editBtn = document.createElement("button");
        editBtn.textContent = "✎";
        editBtn.title = "Edit";
        editBtn.addEventListener("click", () => {
          memoryFormCategory.value = category;
          memoryFormKey.value = key;
          memoryFormValue.value = value;
          memoryFormValue.focus();
        });
        row.appendChild(editBtn);

        const delBtn = document.createElement("button");
        delBtn.textContent = "×";
        delBtn.title = "Delete";
        delBtn.addEventListener("click", () => forgetMemoryEntry(category, key));
        row.appendChild(delBtn);

        memoryList.appendChild(row);
      }
    }

    if (!anyEntries) {
      memoryList.innerHTML = '<div class="memory-empty">Nothing stored yet.</div>';
    }
  } catch (e) {
    memoryList.innerHTML = '<div class="memory-empty">Could not reach ASTI.</div>';
  }
}

function openMemory() {
  memoryBackdrop.hidden = false;
  memoryFormStatus.textContent = "";
  loadMemoryList();
}
function closeMemory() {
  memoryBackdrop.hidden = true;
}

memoryOpen.addEventListener("click", openMemory);
memoryClose.addEventListener("click", closeMemory);
memoryBackdrop.addEventListener("click", (e) => {
  if (e.target === memoryBackdrop) closeMemory();
});

memoryFormSave.addEventListener("click", async () => {
  const category = memoryFormCategory.value;
  const key = memoryFormKey.value.trim();
  const value = memoryFormValue.value.trim();

  if (!key || !value) {
    memoryFormStatus.textContent = "Key and value are both required.";
    return;
  }

  memoryFormStatus.textContent = "Saving…";
  try {
    const res = await fetch("/api/memory/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category, key, value }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      memoryFormStatus.textContent = "Error: " + (err.error || res.statusText);
      return;
    }
    memoryFormKey.value = "";
    memoryFormValue.value = "";
    memoryFormStatus.textContent = "Saved.";
    loadMemoryList();
  } catch (e) {
    memoryFormStatus.textContent = "Could not reach ASTI.";
  }
});

memoryExportBtn.addEventListener("click", async () => {
  memoryFormStatus.textContent = "Exporting…";
  try {
    const res = await fetch("/api/memory/export", { method: "POST" });
    const data = await res.json();
    memoryFormStatus.textContent = res.ok
      ? "Exported to " + data.filename
      : "Error: " + (data.error || res.statusText);
  } catch (e) {
    memoryFormStatus.textContent = "Could not reach ASTI.";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !memoryBackdrop.hidden) closeMemory();
});

// --- Diagnostics modal ---
const statusBackdrop = document.getElementById("status-backdrop");
const statusOpen = document.getElementById("status-open");
const statusClose = document.getElementById("status-close");
const statusRefresh = document.getElementById("status-refresh");
const statusReport = document.getElementById("status-report");

async function loadStatusReport() {
  statusReport.textContent = "Loading…";
  try {
    const res = await fetch("/api/status");
    if (!res.ok) {
      statusReport.textContent = "Could not load diagnostics.";
      return;
    }
    const data = await res.json();
    statusReport.textContent = data.report;
  } catch (e) {
    statusReport.textContent = "Could not reach ASTI.";
  }
}

function openStatus() {
  statusBackdrop.hidden = false;
  loadStatusReport();
}
function closeStatus() {
  statusBackdrop.hidden = true;
}

statusOpen.addEventListener("click", openStatus);
statusClose.addEventListener("click", closeStatus);
statusRefresh.addEventListener("click", loadStatusReport);
statusBackdrop.addEventListener("click", (e) => {
  if (e.target === statusBackdrop) closeStatus();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !statusBackdrop.hidden) closeStatus();
});

// --- Cloud toggle --- a real sliding switch, not a text-label button: a
// button reading "OFF" is ambiguous (is that the current state, or an
// instruction to turn it off?). A switch's position IS the state.
const cloudToggle = document.getElementById("cloud-toggle");
const cloudSwitchLabel = document.getElementById("cloud-switch-label");

function renderCloudToggle(allowCloud) {
  cloudToggle.classList.toggle("on", allowCloud);
  cloudToggle.setAttribute("aria-checked", allowCloud ? "true" : "false");
  cloudToggle.dataset.allowCloud = allowCloud ? "1" : "0";
  cloudToggle.title = allowCloud
    ? "Cloud is ON — general-knowledge questions may reach Claude's API"
    : "Cloud is OFF — everything stays local";
  cloudSwitchLabel.textContent = "Cloud: " + (allowCloud ? "ON" : "OFF");
}

async function loadCloudToggle() {
  try {
    const res = await fetch("/api/settings/cloud");
    if (!res.ok) {
      cloudSwitchLabel.textContent = "Cloud: ?";
      return;
    }
    const data = await res.json();
    renderCloudToggle(data.allow_cloud);
  } catch (e) {
    cloudSwitchLabel.textContent = "Cloud: ?";
  }
}

cloudToggle.addEventListener("click", async () => {
  const next = cloudToggle.dataset.allowCloud !== "1";
  cloudToggle.disabled = true;
  try {
    const res = await fetch("/api/settings/cloud", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ allow_cloud: next }),
    });
    if (res.ok) {
      const data = await res.json();
      renderCloudToggle(data.allow_cloud);
    }
  } catch (e) {
    // leave the label as-is; user can retry the click
  } finally {
    cloudToggle.disabled = false;
  }
});

loadCloudToggle();
</script>
</body>
</html>
