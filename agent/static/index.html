<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1c1f;
    --panel: #232428;
    --border: #33353a;
    --text: #e7e7ea;
    --text-dim: #9a9ba3;
    --accent: #d97757;
    --user-bubble: #2d3b4f;
    --ai-bubble: #26272b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header span {
    font-size: 12px;
    color: var(--text-dim);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: flex-start;
    background: #3a2425;
    border: 1px solid #5c2e30;
    color: #f0a8a8;
  }
  .intent-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .thinking {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 13px;
    padding: 10px 14px;
  }
  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel);
  }
  #input {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #input:focus {
    border-color: var(--accent);
  }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #send:not(:disabled):hover {
    filter: brightness(1.08);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ASTI</h1>
    <span>local-first personal assistant</span>
  </header>
  <div id="messages"></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="Message ASTI..."></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

function addMessage(role, text, intent) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (intent) {
    const tag = document.createElement("div");
    tag.className = "intent-tag";
    tag.textContent = intent;
    div.appendChild(tag);
    const body = document.createElement("div");
    body.textContent = text;
    div.appendChild(body);
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.textContent = "ASTI is thinking…";
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage("user", text);
  inputEl.value = "";
  autosize();
  sendEl.disabled = true;
  const thinking = addThinking();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });

    thinking.remove();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("error", "Error: " + (err.error || res.statusText));
      return;
    }

    const data = await res.json();
    addMessage("ai", data.response, data.intent);
  } catch (e) {
    thinking.remove();
    addMessage("error", "Could not reach ASTI — is the server running?");
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
}

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

inputEl.addEventListener("input", autosize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendEl.addEventListener("click", sendMessage);

inputEl.focus();
</script>
</body>
</html>
